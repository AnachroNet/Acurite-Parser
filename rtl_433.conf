# rtl_433 25.x config format: keyword + argument to end of line (see upstream
# conf/rtl_433.example.conf). Comments start with # only at line beginning.
#
# Installed reference (after "cmake --build build --target install"):
#   /usr/local/etc/rtl_433/rtl_433.example.conf

frequency 433.92M

# JSON only on stdout for parse_acurite_log.py (disable default kv/log output).
output null
output json

# Reduce false pulses / CPU (bitbuffer row-count warnings on long runs).
pulse_detect autolevel
pulse_detect squelch
pulse_detect magest

# --- Protocols (Acurite only; numbers match rtl_433 25.12) ---
# Disable all decoders, then enable Acurite devices (Tower, 5-in-1, 6045M, …).
protocol 0

protocol 10   # Acurite 896 Rain Gauge
protocol 11   # Acurite 609TXC Temperature and Humidity Sensor
protocol 40   # Acurite 592TXR, 5-in-1, 6045 lightning, Atlas, …
protocol 41   # Acurite 986 Refrigerator / Freezer Thermometer
protocol 55   # Acurite 606TX / Technoline TX960 Temperature Sensor
protocol 74   # Acurite 00275rm, 00276rm Temp/Humidity with optional probe
protocol 163  # Acurite 590TX Temperature with optional Humidity
protocol 197  # Acurite Grill/Meat Thermometer 01185M

